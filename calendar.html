<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – AmatörKreatörerna</title>
  <link rel="stylesheet" href="style.css?v=1.0">
  <link rel="icon" type="image/png" href="AK_logga_square.png">
</head>
<body>
  <!-- Fixed header (same as other pages) -->
  <header class="fixed-header">
    <div class="header-inner">
      <img src="AK_logo.png" alt="AmatörKreatörerna Logo" class="logo">
      <h1>
        <a href="index.html" class="home-link">
          AmatörKreatörerna
        </a>
      </h1>
      <nav>
        <a href="projekt.html" class="nav-link">Projekt</a>
        <a href="calendar.html" class="nav-link">Kalender</a>
      </nav>
    </div>
  </header>

   <main class="calendar-container">
    <h2>Vår Kalender</h2>
    <div class="calendar-nav">
      <button id="prevMonth">←</button>
      <h3 id="monthYear"></h3>
      <button id="nextMonth">→</button>
    </div>

     <div class="weekday-header">
      <div>Mån</div>
      <div>Tis</div>
      <div>Ons</div>
      <div>Tors</div>
      <div>Fre</div>
      <div>Lör</div>
      <div>Sön</div>
    </div>

    <div id="calendar"></div>
  </main>

  <!-- Popup for event details -->
  <div id="eventPopup" class="popup hidden">
    <div class="popup-content">
      <span id="closePopup">&times;</span>
      <h3 id="popupDate"></h3>
      <ul id="eventList"></ul>
    </div>
  </div>

  <script src="calendar.js" defer></script>
</body>
</html>
