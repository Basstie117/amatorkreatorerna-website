<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – AmatörKreatörerna</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="calendar.js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <!-- Fixed header (same as other pages) -->
  <header class="fixed-header">
    <div class="header-inner">
      <img src="logo.png" alt="AmatörKreatörerna Logo" class="logo">
      <h1>
        <a href="index.html" class="home-link">
          <span class="brand-first">Amatör</span>
          <span class="brand-second">Kreatörerna</span>
        </a>
      </h1>
      <nav>
        <a href="about.html" class="nav-link">Om oss</a>
        <a href="calendar.html" class="nav-link">Kalender</a>
      </nav>
    </div>
  </header>

  <main class="calendar-page">
    <h2>Kalender</h2>
    <div id="calendar"></div>
  </main>

  <!-- Popup Modal -->
  <div id="event-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3 id="event-date"></h3>
      <ul id="event-list"></ul>
    </div>
  </div>
</body>
</html>
